<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>恋爱小屋 · 唯美风景</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft YaHei', cursive, sans-serif;
    }
    
    /* 完美适配 1:1 比例图片 */
    #app {
      position: relative;
      width: min(100vw, 100vh);
      aspect-ratio: 1 / 1;
      background-image: url('bg.jpg'); 
      background-size: cover;
      background-position: center;
      overflow: hidden;
      cursor: default;
    }

    @media (min-width: 800px) {
      #app {
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
    }

    /* PixiJS 特效画布层 */
    #sceneCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 2;
      pointer-events: none; /* 让点击事件穿透到下方的DOM热点 */
    }

    /* ======= 透明点击热区（已根据新图重新校准） ======= */
    .hotspot {
      position: absolute;
      z-index: 3;
      cursor: pointer;
      border-radius: 20px;
      transition: background 0.2s;
    }
    .hotspot:active {
      background: rgba(255, 255, 255, 0.15); /* 点击反馈 */
    }
    
    #hs-river { left: 0; top: 20%; width: 50%; height: 80%; } /* 河流 */
    #hs-house { right: 0; top: 5%; width: 40%; height: 45%; } /* 房子 */
    #hs-tree { left: 25%; top: 30%; width: 30%; height: 35%; } /* 大树 */
    #hs-cat { left: 39%; top: 73%; width: 8%; height: 10%; } /* 黑白猫 */
    #hs-dog { left: 55%; top: 80%; width: 10%; height: 12%; } /* 柴犬 */
    #hs-couple { left: 47%; top: 65%; width: 38%; height: 20%; } /* 人物 */

    /* UI 界面层 */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #settingsBtn {
      position: absolute; top: 16px; right: 20px; width: 46px; height: 46px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.85); border: none; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-size: 1.4rem; cursor: pointer; pointer-events: auto; z-index: 15;
      transition: 0.1s; display: flex; align-items: center; justify-content: center;
    }
    #settingsBtn:active { transform: scale(0.9); }

    /* 弹窗面板 */
    .panel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90%; max-width: 600px;
      background: #fff7ec;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 20px 24px 24px;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      max-height: 85%;
      border: 4px solid #d9b382;
      z-index: 20;
    }
    .panel.active { display: flex; }
    .panel h2 {
      font-size: 1.5rem; color: #4a2c1a; text-align: center; margin-bottom: 12px;
    }
    .panel .close-btn {
      position: absolute; top: 12px; right: 16px; font-size: 1.8rem;
      background: none; border: none; color: #8b5a2b; cursor: pointer;
    }
    .panel .content {
      overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
      padding-bottom: 10px;
    }

    @media (max-width: 480px) {
      .panel { width: 95%; padding: 16px; }
      .panel h2 { font-size: 1.3rem; }
    }

    /* 各种组件样式 */
    .photo-flow { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
    .photo-card {
      flex: 0 0 100px; height: 100px; border-radius: 12px;
      background: #ffe8d4; border: 2px dashed #d9a066;
      background-size: cover; background-position: center; cursor: pointer;
    }
    .upload-row { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .btn {
      background: #f7c948; border: none; border-radius: 30px; padding: 8px 20px;
      font-size: 1rem; font-weight: bold; color: #4a2c1a; box-shadow: 0 4px 0 #b28b5c;
      cursor: pointer; font-family: inherit; transition: 0.1s;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b28b5c; }
    .btn.secondary { background: #c1d9d0; box-shadow: 0 4px 0 #7f9e91; }
    .btn.small { padding: 6px 14px; font-size: 0.85rem; }
    .btn.danger { background: #f4a3a3; box-shadow: 0 4px 0 #b35959; }

    .fruit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; }
    .fruit-item {
      aspect-ratio: 1; background: #ffb882; border-radius: 50%; font-size: 1.8rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 0 #b35959; cursor: pointer; border: 2px solid #e07a5f;
    }
    .fruit-item:active { transform: scale(0.9); }

    .pet-card {
      background: #f5ede1; border-radius: 20px; padding: 12px 16px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border: 2px solid #d9b382;
    }
    .pet-avatar { font-size: 2.5rem; width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .pet-info { flex: 1; min-width: 120px; }
    .affinity-bar { height: 12px; background: #e0d0bc; border-radius: 10px; margin: 4px 0; overflow: hidden; }
    .affinity-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f7b267, #f4845f); transition: width 0.3s; }
    .pet-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .room-tabs, .style-selector { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
    .room-tab, .style-btn {
      background: #e3d5c4; border: none; border-radius: 20px; padding: 6px 14px;
      font-weight: bold; color: #5a3e28; cursor: pointer; font-size: 0.9rem;
    }
    .room-tab.active, .style-btn.active { background: #f7c948; box-shadow: 0 3px 0 #b28b5c; }

    .room-canvas-wrap {
      position: relative; background: #d9c8b2; border-radius: 16px; overflow: hidden;
      aspect-ratio: 16 / 10; border: 3px solid #b28b5c;
    }
    .room-bg { position: absolute; inset: 0; transition: background 0.3s; }
    .room-bg.raw { background: repeating-linear-gradient(45deg, #b8a898, #b8a898 10px, #c8b8a8 10px, #c8b8a8 20px); }
    .room-bg.chinese { background: linear-gradient(135deg, #dfc8a8, #c9a87c); }
    .room-bg.american { background: linear-gradient(135deg, #b8c4b0, #8a9a80); }
    .room-bg.european { background: linear-gradient(135deg, #e8d8c8, #c8b8a8); }
    .room-bg.modern { background: linear-gradient(135deg, #d0d8e0, #a8b8c8); }

    .placed-furniture {
      position: absolute; width: 40px; height: 40px; display: flex; align-items: center;
      justify-content: center; font-size: 1.5rem; cursor: grab; transform-origin: center bottom;
    }
    .furniture-palette { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; flex-wrap: wrap; }
    .furniture-btn {
      background: #fff; border: 2px solid #d9b382; border-radius: 12px; padding: 4px 8px;
      display: flex; flex-direction: column; align-items: center; font-size: 1.5rem; cursor: pointer;
    }
    .furniture-btn span { font-size: 0.65rem; color: #4a2c1a; }

    .upload-label {
      background: #f7c948; border-radius: 30px; padding: 8px 20px; font-weight: bold;
      color: #4a2c1a; box-shadow: 0 4px 0 #b28b5c; cursor: pointer; display: inline-block;
    }
    .upload-label:active { transform: translateY(4px); box-shadow: 0 1px 0 #b28b5c; }
    input[type="file"] { display: none; }

    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e8d8c4; }
    .setting-row input { width: 80px; padding: 6px; border-radius: 10px; border: 1px solid #d9b382; text-align: center; }

    .video-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100; }
    .video-modal.active { display: flex; }
    .video-modal video { max-width: 95%; max-height: 80%; border-radius: 16px; }
    .video-modal .close-video { position: absolute; top: 20px; right: 20px; font-size: 2.5rem; color: #fff; background: none; border: none; }

    .toast {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(74, 44, 26, 0.9); color: #ffe8d4; padding: 10px 24px; 
      border-radius: 30px; font-size: 0.95rem; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 透明点击热区 -->
    <div class="hotspot" id="hs-river"></div>
    <div class="hotspot" id="hs-house"></div>
    <div class="hotspot" id="hs-tree"></div>
    <div class="hotspot" id="hs-cat"></div>
    <div class="hotspot" id="hs-dog"></div>
    <div class="hotspot" id="hs-couple"></div>

    <!-- 特效画布 -->
    <canvas id="sceneCanvas"></canvas>

    <!-- UI 层 -->
    <div class="ui-layer">
      <button id="settingsBtn" title="设置">⚙️</button>

      <div class="panel" id="panel-river">
        <button class="close-btn" data-close="panel-river">✕</button>
        <h2>🌊 河流相册</h2>
        <div class="content">
          <div class="upload-row">
            <label class="upload-label" for="photoInput">📷 上传照片</label>
            <input type="file" id="photoInput" accept="image/*" multiple>
            <span id="photoCountLabel" style="color:#8b6b4b; font-weight:bold;">0 / 1000</span>
          </div>
          <div class="photo-flow" id="photoFlow"></div>
        </div>
      </div>

      <div class="panel" id="panel-tree">
        <button class="close-btn" data-close="panel-tree">✕</button>
        <h2>🌳 果树 · 视频</h2>
        <div class="content">
          <div class="upload-row">
            <label class="upload-label" for="videoInput">🎬 挂一个视频</label>
            <input type="file" id="videoInput" accept="video/*">
            <span id="fruitCountLabel" style="color:#8b6b4b; font-weight:bold;">0 个果子</span>
          </div>
          <div class="fruit-grid" id="fruitGrid"></div>
        </div>
      </div>

      <div class="panel" id="panel-pet">
        <button class="close-btn" data-close="panel-pet">✕</button>
        <h2>🐾 宠物伙伴</h2>
        <div class="content" id="petList"></div>
      </div>

      <div class="panel" id="panel-house">
        <button class="close-btn" data-close="panel-house">✕</button>
        <h2>🏠 我们的家</h2>
        <div class="content">
          <div class="room-tabs" id="roomTabs">
            <button class="room-tab active" data-room="living">🛋️ 客厅</button>
            <button class="room-tab" data-room="bedroom">🛏️ 卧室</button>
            <button class="room-tab" data-room="bathroom">🚿 卫生间</button>
          </div>
          <div class="style-selector" id="styleSelector">
            <button class="style-btn" data-style="raw">毛坯</button>
            <button class="style-btn" data-style="chinese">🏮 中式</button>
            <button class="style-btn" data-style="american">🌿 美式</button>
            <button class="style-btn" data-style="european">🏛️ 欧式</button>
            <button class="style-btn active" data-style="modern">✨ 现代</button>
          </div>
          <div class="room-canvas-wrap" id="roomCanvasWrap">
            <div class="room-bg modern" id="roomBg"></div>
          </div>
          <div class="furniture-palette" id="furniturePalette"></div>
        </div>
      </div>

      <div class="panel" id="panel-settings">
        <button class="close-btn" data-close="panel-settings">✕</button>
        <h2>⚙️ 设置</h2>
        <div class="content">
          <div class="setting-row">
            <label>照片容量上限</label>
            <input type="number" id="setPhotoCap" min="1" value="1000">
          </div>
          <div class="setting-row">
            <label>🍖 喂食冷却（秒）</label>
            <input type="number" id="setCdFeed" min="0" step="0.5" value="2">
          </div>
          <div class="setting-row">
            <label>🤚 抚摸冷却（秒）</label>
            <input type="number" id="setCdPet" min="0" step="0.5" value="1">
          </div>
          <div class="setting-row">
            <label>🎾 玩耍冷却（秒）</label>
            <input type="number" id="setCdPlay" min="0" step="0.5" value="1.5">
          </div>
          <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
            <button class="btn" id="saveSettingsBtn">保存</button>
            <button class="btn danger" id="clearDataBtn">清空数据</button>
          </div>
        </div>
      </div>

      <div class="video-modal" id="videoModal">
        <button class="close-video" id="closeVideoBtn">✕</button>
        <video id="videoPlayer" controls playsinline></video>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    // ==================== 数据状态 ====================
    const state = {
      photos: [], photoCapacity: 1000,
      videos: [],
      pets: [
        { id: 'cat1', name: '猫猫', kind: 'cat', emoji: '🐱', affinityMale: 30, affinityFemale: 55 },
        { id: 'dog1', name: '狗狗', kind: 'dog', emoji: '🐶', affinityMale: 60, affinityFemale: 20 }
      ],
      room: { currentRoom: 'living', currentStyle: 'modern', furniture: { living: [], bedroom: [], bathroom: [] } }
    };

    const FURNITURE_LIB = {
      chinese: [{ name: '罗汉床', emoji: '🛋️' }, { name: '条案', emoji: '🪑' }, { name: '宫灯', emoji: '🏮' }],
      american: [{ name: '沙发', emoji: '🛋️' }, { name: '木桌', emoji: '🪵' }, { name: '落地灯', emoji: '💡' }],
      european: [{ name: '雕花沙发', emoji: '🛋️' }, { name: '大理石桌', emoji: '🪞' }, { name: '水晶灯', emoji: '💎' }],
      modern: [{ name: '简约沙发', emoji: '🛋️' }, { name: '茶几', emoji: '🔲' }, { name: '弧线灯', emoji: '💡' }, { name: '电视', emoji: '📺' }]
    };
    const ROOM_FURNITURE = { living: ['🛋️', '🪑', '📺'], bedroom: ['🛏️', '🪑', '🧸'], bathroom: ['🚿', '🛁', '🪞'] };

    // ==================== 本地存储 ====================
    const DB_NAME = 'love-house-db', DB_VERSION = 1; let db = null;
    function openDB() { return new Promise((res, rej) => { const r = indexedDB.open(DB_NAME, DB_VERSION); r.onupgradeneeded = e => { const d = e.target.result; if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' }); if(!d.objectStoreNames.contains('videos')) d.createObjectStore('videos', { keyPath: 'id' }); }; r.onsuccess = e => { db = e.target.result; res(); }; r.onerror = rej; }); }
    function dbPut(store, val) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(val); tx.oncomplete = res; tx.onerror = rej; }); }
    function dbGetAll(store) { return new Promise((res, rej) => { const r = db.transaction(store, 'readonly').objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = rej; }); }
    function dbDelete(store, id) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = res; tx.onerror = rej; }); }
    function dbClear(store) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).clear(); tx.oncomplete = res; tx.onerror = rej; }); }

    const LS_PETS = 'lh_pets_v1', LS_ROOM = 'lh_room_v1', LS_SETTINGS = 'lh_settings_v1';
    function savePets() { localStorage.setItem(LS_PETS, JSON.stringify(state.pets.map(p => ({ id: p.id, aM: p.affinityMale, aF: p.affinityFemale })))); }
    function loadPets() { try { const arr = JSON.parse(localStorage.getItem(LS_PETS)); if(arr) arr.forEach(s => { const p = state.pets.find(x => x.id === s.id); if(p) { p.affinityMale = s.aM; p.affinityFemale = s.aF; } }); } catch(e){} }
    function saveRoom() { localStorage.setItem(LS_ROOM, JSON.stringify(state.room)); }
    function loadRoom() { try { const r = JSON.parse(localStorage.getItem(LS_ROOM)); if(r) state.room = { ...state.room, ...r }; } catch(e){} }

    const PET_ACTIONS = { feed: { base: 5, cooldown: 2000 }, pet: { base: 3, cooldown: 1000 }, play: { base: 4, cooldown: 1500 } };
    function saveSettings() { localStorage.setItem(LS_SETTINGS, JSON.stringify({ cap: state.photoCapacity, cd: { feed: PET_ACTIONS.feed.cooldown/1000, pet: PET_ACTIONS.pet.cooldown/1000, play: PET_ACTIONS.play.cooldown/1000 } })); }
    function loadSettings() { try { const s = JSON.parse(localStorage.getItem(LS_SETTINGS)); if(s) { state.photoCapacity = s.cap || 1000; if(s.cd) { PET_ACTIONS.feed.cooldown = s.cd.feed*1000; PET_ACTIONS.pet.cooldown = s.cd.pet*1000; PET_ACTIONS.play.cooldown = s.cd.play*1000; } } } catch(e){} }

    async function loadMedia() {
      const p = await dbGetAll('photos'); state.photos = p.sort((a,b)=>a.createdAt-b.createdAt).map(x => ({ id: x.id, name: x.name, url: URL.createObjectURL(x.blob) }));
      const v = await dbGetAll('videos'); state.videos = v.sort((a,b)=>a.createdAt-b.createdAt).map(x => ({ id: x.id, name: x.name, url: URL.createObjectURL(x.blob) }));
    }

    // ==================== PixiJS 特效层 ====================
    let app = null, heartTexture = null, heartContainer = null, photoContainer = null, fruitSprites = [];
    
    async function initPixi() {
      const PIXI = window.PIXI;
      app = new PIXI.Application({
        view: document.getElementById('sceneCanvas'),
        resizeTo: document.getElementById('app'),
        backgroundAlpha: 0, // 透明背景，露出底下的图片
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
      });

      heartContainer = new PIXI.Container();
      photoContainer = new PIXI.Container();
      app.stage.addChild(heartContainer, photoContainer);

      // 生成爱心纹理
      const g = new PIXI.Graphics();
      g.beginFill(0xff4d6d);
      g.moveTo(0, 6); g.bezierCurveTo(-8, -4, -14, 8, 0, 18); g.bezierCurveTo(14, 8, 8, -4, 0, 6);
      g.endFill();
      heartTexture = app.renderer.generateTexture(g);
      g.destroy();

      initPhotoFlow();
      state.videos.forEach(() => addFruitVisual());

      app.ticker.add(animate);
    }

    // 照片流动逻辑（沿左侧河流飘动，从左上到右下）
    let photoSprites = [];
    function initPhotoFlow() {
      const PIXI = window.PIXI;
      if(!photoContainer) return;
      photoContainer.removeChildren();
      photoSprites = [];

      for(let i = 0; i < 10; i++) {
        const s = new PIXI.Sprite(PIXI.Texture.WHITE);
        s.anchor.set(0.5);
        s._t = Math.random(); 
        s._speed = 0.001 + Math.random() * 0.0015;
        s._slot = i;
        s._currentId = null;
        assignTexture(s);
        photoContainer.addChild(s);
        photoSprites.push(s);
      }
    }

    function assignTexture(s) {
      const PIXI = window.PIXI;
      if(state.photos.length > 0) {
        const p = state.photos[s._slot % state.photos.length];
        if(s._currentId !== p.id) {
          try { s.texture = PIXI.Texture.from(p.url); } catch(e) { s.texture = PIXI.Texture.WHITE; }
          s._currentId = p.id; s._targetW = 80; // 稍微调大一点点
        }
      } else {
        if(s._currentId !== 'heart') { s.texture = heartTexture; s._currentId = 'heart'; s._targetW = 30; }
      }
    }

    function animate(delta) {
      if(!app) return;
      const W = app.screen.width, H = app.screen.height;

      // 照片沿河流移动（匹配新图江面走向：从远方中上部飘向近处左下部）
      photoContainer.children.forEach(s => {
        s._t += s._speed * delta;
        if(s._t > 1.05) { s._t = -0.05; assignTexture(s); }
        
        // 起点: 中上方江面(45%, 20%) -> 终点: 左下角(0%, 95%)
        const x = W * (0.45 - s._t * 0.45);
        const y = H * (0.20 + s._t * 0.75) + Math.sin(s._t * Math.PI * 4) * 15;
        s.x = x; s.y = y;

        const depth = 0.4 + Math.sin(Math.max(0, Math.min(1, s._t)) * Math.PI) * 0.6;
        const base = s._targetW / (s.texture.width || 100);
        s.scale.set(base * depth);
        s.alpha = 0.5 + depth * 0.5;
      });

      // 爱心粒子飘动
      heartContainer.children.forEach(h => {
        h.y -= 0.8 * delta; h.alpha -= 0.01 * delta; h.rotation += 0.02 * delta;
        if(h.alpha <= 0) { heartContainer.removeChild(h); h.destroy(); }
      });

      // 果子飘动
      fruitSprites.forEach(f => { if(f._baseY) f.y = f._baseY + Math.sin(Date.now()*0.002) * 3; });
    }

    function spawnHearts(e) {
      if(!heartContainer) return;
      const rect = document.getElementById('app').getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      for(let i=0; i<3; i++) {
        const h = new PIXI.Sprite(heartTexture);
        h.anchor.set(0.5);
        h.x = x + (Math.random()-0.5)*20;
        h.y = y + (Math.random()-0.5)*20;
        h.scale.set(0.3 + Math.random()*0.3);
        heartContainer.addChild(h);
      }
    }

    // 树上结果子（匹配大树的树冠位置：约 25% ~ 55% 宽，30% ~ 55% 高）
    function addFruitVisual() {
      if(!app) return;
      const PIXI = window.PIXI;
      const fruit = new PIXI.Graphics();
      fruit.beginFill(0xff3333); fruit.drawCircle(0, 0, 7); fruit.endFill();
      fruit.beginFill(0xffd700); fruit.drawCircle(-2, -2, 1.5); fruit.endFill(); // 加个小高光
      
      fruit.x = app.screen.width * (0.28 + Math.random() * 0.22);
      fruit.y = app.screen.height * (0.32 + Math.random() * 0.18);
      fruit._baseY = fruit.y;

      app.stage.addChild(fruit);
      fruitSprites.push(fruit);
    }

    // ==================== 业务逻辑 ====================
    function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1500); }
    
    function openPanel(id) { document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='panel-settings') fillSettings(); }
    document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', () => document.getElementById(btn.dataset.close).classList.remove('active')));
    document.getElementById('settingsBtn').addEventListener('click', () => openPanel('panel-settings'));

    // --- 河流相册 ---
    function renderRiverPanel() {
      const flow = document.getElementById('photoFlow'); flow.innerHTML = '';
      document.getElementById('photoCountLabel').textContent = `${state.photos.length} / ${state.photoCapacity}`;
      state.photos.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'photo-card'; div.style.backgroundImage = `url(${p.url})`;
        div.onclick = async () => { if(confirm('删除照片？')) { await dbDelete('photos', p.id); URL.revokeObjectURL(p.url); state.photos.splice(idx,1); renderRiverPanel(); initPhotoFlow(); } };
        flow.appendChild(div);
      });
    }

    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files); e.target.value = '';
      if(state.photos.length + files.length > state.photoCapacity) return toast('容量不足');
      for(const f of files) {
        const id = 'p_' + Date.now();
        await dbPut('photos', { id, name: f.name, blob: f, createdAt: Date.now() });
        state.photos.push({ id, name: f.name, url: URL.createObjectURL(f) });
      }
      renderRiverPanel(); initPhotoFlow(); toast('上传成功');
    });

    // --- 果树视频 ---
    function renderTreePanel() {
      const grid = document.getElementById('fruitGrid'); grid.innerHTML = '';
      document.getElementById('fruitCountLabel').textContent = `${state.videos.length} 个果子`;
      state.videos.forEach(v => {
        const div = document.createElement('div');
        div.className = 'fruit-item'; div.textContent = '🍎';
        div.onclick = () => { document.getElementById('videoPlayer').src = v.url; document.getElementById('videoModal').classList.add('active'); document.getElementById('videoPlayer').play(); };
        grid.appendChild(div);
      });
    }

    document.getElementById('videoInput').addEventListener('change', async (e) => {
      const f = e.target.files[0]; e.target.value = '';
      if(!f) return;
      const id = 'v_' + Date.now();
      await dbPut('videos', { id, name: f.name, blob: f, createdAt: Date.now() });
      state.videos.push({ id, name: f.name, url: URL.createObjectURL(f) });
      renderTreePanel(); addFruitVisual(); toast('结出新果子');
    });

    document.getElementById('closeVideoBtn').onclick = () => { const v = document.getElementById('videoPlayer'); v.pause(); v.src=''; document.getElementById('videoModal').classList.remove('active'); };

    // --- 宠物 ---
    const cdMap = {};
    function renderPetPanel() {
      const list = document.getElementById('petList'); list.innerHTML = '';
      state.pets.forEach(p => {
        list.innerHTML += `
          <div class="pet-card">
            <div class="pet-avatar">${p.emoji}</div>
            <div class="pet-info">
              <div style="font-weight:bold;">${p.name}</div>
              <div style="font-size:0.8rem;">👨 好感度 ${p.affinityMale}%</div>
              <div class="affinity-bar"><div class="affinity-fill" style="width:${p.affinityMale}%"></div></div>
              <div style="font-size:0.8rem;">👩 好感度 ${p.affinityFemale}%</div>
              <div class="affinity-bar"><div class="affinity-fill" style="width:${p.affinityFemale}%"></div></div>
            </div>
            <div class="pet-actions">
              <button class="btn small" data-p="${p.id}" data-a="feed" data-t="male">🍖喂男</button>
              <button class="btn small" data-p="${p.id}" data-a="feed" data-t="female">🍖喂女</button>
              <button class="btn small secondary" data-p="${p.id}" data-a="pet" data-t="male">🤚摸男</button>
              <button class="btn small secondary" data-p="${p.id}" data-a="pet" data-t="female">🤚摸女</button>
            </div>
          </div>`;
      });
      list.querySelectorAll('button[data-p]').forEach(btn => {
        btn.onclick = (e) => {
          const key = btn.dataset.p + btn.dataset.a + btn.dataset.t;
          if(cdMap[key] && Date.now() - cdMap[key] < PET_ACTIONS[btn.dataset.a].cooldown) return toast('冷却中');
          cdMap[key] = Date.now();
          const p = state.pets.find(x=>x.id===btn.dataset.p);
          const delta = PET_ACTIONS[btn.dataset.a].base + Math.floor(Math.random()*3);
          if(btn.dataset.t === 'male') p.affinityMale = Math.min(100, p.affinityMale + delta); else p.affinityFemale = Math.min(100, p.affinityFemale + delta);
          savePets(); renderPetPanel(); toast('好感度 +' + delta);
          spawnHearts(e);
        };
      });
    }

    // --- 房屋 ---
    function renderHousePanel() {
      document.querySelectorAll('.room-tab').forEach(t => t.classList.toggle('active', t.dataset.room === state.room.currentRoom));
      document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.dataset.style === state.room.currentStyle));
      document.getElementById('roomBg').className = 'room-bg ' + state.room.currentStyle;
      
      const wrap = document.getElementById('roomCanvasWrap'); wrap.querySelectorAll('.placed-furniture').forEach(e=>e.remove());
      (state.room.furniture[state.room.currentRoom]||[]).forEach((item, i) => {
        const el = document.createElement('div');
        el.className = 'placed-furniture'; el.textContent = item.emoji;
        el.style.left = item.x+'%'; el.style.top = item.y+'%'; el.style.transform = `translate(-50%,-100%)`;
        el.ondblclick = () => { state.room.furniture[state.room.currentRoom].splice(i,1); saveRoom(); renderHousePanel(); };
        
        let isDrag = false, sx, sy, ox, oy;
        el.onpointerdown = (e) => { e.preventDefault(); isDrag=true; sx=e.clientX; sy=e.clientY; ox=item.x; oy=item.y; el.setPointerCapture(e.pointerId); };
        el.onpointermove = (e) => { if(!isDrag) return; const r = wrap.getBoundingClientRect(); item.x = Math.max(5, Math.min(95, ox + ((e.clientX-sx)/r.width)*100)); item.y = Math.max(5, Math.min(95, oy + ((e.clientY-sy)/r.height)*100)); el.style.left=item.x+'%'; el.style.top=item.y+'%'; };
        el.onpointerup = (e) => { isDrag=false; el.releasePointerCapture(e.pointerId); saveRoom(); };
        wrap.appendChild(el);
      });
      
      const pal = document.getElementById('furniturePalette'); pal.innerHTML = '';
      (FURNITURE_LIB[state.room.currentStyle]||[]).forEach(f => {
        const b = document.createElement('button'); b.className = 'furniture-btn';
        b.innerHTML = `${f.emoji}<span>${f.name}</span>`;
        b.onclick = () => { state.room.furniture[state.room.currentRoom].push({ emoji: f.emoji, x: 20+Math.random()*60, y: 30+Math.random()*50 }); saveRoom(); renderHousePanel(); };
        pal.appendChild(b);
      });
    }

    document.querySelectorAll('.room-tab').forEach(t => t.onclick = () => { state.room.currentRoom = t.dataset.room; saveRoom(); renderHousePanel(); });
    document.querySelectorAll('.style-btn').forEach(b => b.onclick = () => { state.room.currentStyle = b.dataset.style; saveRoom(); renderHousePanel(); });

    // --- 设置 ---
    function fillSettings() {
      document.getElementById('setPhotoCap').value = state.photoCapacity;
      document.getElementById('setCdFeed').value = PET_ACTIONS.feed.cooldown/1000;
      document.getElementById('setCdPet').value = PET_ACTIONS.pet.cooldown/1000;
      document.getElementById('setCdPlay').value = PET_ACTIONS.play.cooldown/1000;
    }
    document.getElementById('saveSettingsBtn').onclick = () => {
      state.photoCapacity = parseInt(document.getElementById('setPhotoCap').value)||1000;
      PET_ACTIONS.feed.cooldown = (parseFloat(document.getElementById('setCdFeed').value)||0)*1000;
      PET_ACTIONS.pet.cooldown = (parseFloat(document.getElementById('setCdPet').value)||0)*1000;
      PET_ACTIONS.play.cooldown = (parseFloat(document.getElementById('setCdPlay').value)||0)*1000;
      saveSettings(); toast('设置已保存'); document.getElementById('panel-settings').classList.remove('active');
    };
    document.getElementById('clearDataBtn').onclick = async () => {
      if(!confirm('确定清空所有数据？')) return;
      await dbClear('photos'); await dbClear('videos'); localStorage.clear(); location.reload();
    };

    // ==================== 绑定热区 & 启动 ====================
    document.getElementById('hs-river').onclick = () => { renderRiverPanel(); openPanel('panel-river'); };
    document.getElementById('hs-house').onclick = () => { renderHousePanel(); openPanel('panel-house'); };
    document.getElementById('hs-tree').onclick = () => { renderTreePanel(); openPanel('panel-tree'); };
    document.getElementById('hs-cat').onclick = () => { renderPetPanel(); openPanel('panel-pet'); };
    document.getElementById('hs-dog').onclick = () => { renderPetPanel(); openPanel('panel-pet'); };
    document.getElementById('hs-couple').onclick = () => { renderPetPanel(); openPanel('panel-pet'); };

    (async function() {
      await openDB(); await loadMedia(); loadPets(); loadRoom(); loadSettings();
      
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js';
      script.onload = () => { initPixi(); setTimeout(()=>toast('💕 欢迎回到恋爱小屋'), 600); };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
